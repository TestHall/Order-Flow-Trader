<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#f4f1ea">
<title>Haushaltsplaner</title>
<style>
:root{
  --bg:#f4f1ea; --panel:#fff; --ink:#1f2328; --muted:#6b7280; --line:#e3ddd0; --dim:#efebe3;
  --accent:#2f6fde; --danger:#c8352b; --ok:#2e9b57; --gold:#f2b632; --gold-d:#c98a0b;
  --task-w:190px; --row-h:56px; --box:40px; --pc:#2f6fde;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font:16px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overflow:hidden}
input,textarea{-webkit-user-select:text;user-select:text;font:inherit;color:inherit}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus{outline:none}
#app{display:flex;flex-direction:column;height:100%}

/* ---------- Kopfzeile ---------- */
#top{display:flex;align-items:center;background:var(--panel);border-bottom:1px solid var(--line);min-height:64px;padding:0 6px;flex:0 0 auto}
#tabs{display:flex;flex:1 1 auto;overflow-x:auto;min-width:0;-webkit-overflow-scrolling:touch}
.tab{display:flex;align-items:center;margin:6px 3px;border-radius:14px;background:var(--bg);border:2px solid transparent;flex:0 0 auto}
.tab.sel{background:#fff;border-color:var(--pc)}
.tab.pinned{background:#fff;box-shadow:inset 0 -4px 0 var(--pc)}
.tab-main{display:flex;align-items:center;min-height:48px;padding:0 4px 0 8px;background:none;border:0}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--pc);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;flex:0 0 auto}
.tab-name{font-weight:600;font-size:17px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-left:8px}
.pinbtn{width:44px;min-height:48px;border:0;background:none;font-size:20px;opacity:.28}
.pinned .pinbtn{opacity:1}
#weeknav{display:flex;align-items:center;flex:0 0 auto;margin-left:6px}
.navbtn{min-width:48px;min-height:48px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:20px;margin:0 3px;padding:0 10px}
.navbtn.today-btn{font-size:16px;font-weight:600}
#weeklabel{text-align:center;min-width:132px;font-weight:700;line-height:1.15;padding:0 4px}
#weeklabel small{display:block;font-weight:400;color:var(--muted);font-size:13px}
#lockind{flex:0 0 auto}
#lockind button{min-height:48px;border:0;background:#fff4d6;border-radius:12px;padding:0 10px;margin:0 3px;font-weight:600;font-size:15px}
#gear{min-width:52px;min-height:48px;border:0;background:none;font-size:26px}
#banner{display:none;background:#fde2df;color:#7a1d16;padding:8px 14px;font-size:15px;border-bottom:1px solid #f0c4c0}
#banner.show{display:block}

/* ---------- Raster ---------- */
#board{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;padding:0 6px}
.grid{display:grid}
#ghead{flex:0 0 auto;background:var(--bg)}
#gscroll{flex:1 1 auto;overflow-y:auto;min-height:0;-webkit-overflow-scrolling:touch}
#gfoot{flex:0 0 auto;border-top:2px solid var(--line);background:var(--panel)}
.th{grid-row:1 / span 2;display:flex;align-items:flex-end;padding:6px 8px;color:var(--muted);font-size:14px;font-weight:600}
.ph{grid-row:1;display:flex;align-items:center;justify-content:center;padding:6px 4px 2px;font-weight:700;font-size:17px;border-left:3px solid var(--line);min-width:0}
.ph .avatar{width:26px;height:26px;font-size:14px;margin-right:6px}
.ph span.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dh{grid-row:2;text-align:center;padding:2px 0 6px;font-size:14px;color:var(--muted);line-height:1.15;border-bottom:2px solid var(--line);min-width:0;overflow:hidden}
.dh b{display:block;color:var(--ink);font-size:15px}
.dh.today{background:var(--accent);color:#e8f0ff;border-radius:10px 10px 0 0}
.dh.today b{color:#fff}
.pstart{border-left:3px solid var(--line)}
.tcell{display:flex;align-items:center;text-align:left;min-height:var(--row-h);background:#fff;border:0;border-bottom:1px solid var(--line);padding:4px 6px 4px 8px;min-width:0}
.tcell .tx{margin-left:8px;min-width:0;flex:1 1 auto}
.tcell .tt{display:block;font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tcell .tv{display:block;font-size:13px;color:var(--muted)}
.row-first-spec{border-top:3px solid var(--line)}
.ticon{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;border-radius:50%;line-height:1}
.ticon.emo{width:38px;height:38px;font-size:28px}
.ticon.ini{width:38px;height:38px;color:#fff;font-weight:800;font-size:15px;letter-spacing:.5px}
.c{min-height:var(--row-h);border:0;border-bottom:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;padding:0;min-width:0}
.c.today{background:#fff7d9}
.c.nd{background:#f7f5f0}
.c.today.nd{background:#f4eed6}
.c.na{background:#ebe7de;background-image:repeating-linear-gradient(45deg,rgba(0,0,0,.025) 0,rgba(0,0,0,.025) 6px,transparent 6px,transparent 12px)}
.box{width:var(--box);height:var(--box);border:3px solid var(--pc);border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:24px;position:relative;background:#fff}
.c.done .box{background:var(--pc)}
.c.fut .box{opacity:.32;border-style:dashed}
.c.lock .box{opacity:.55}
.c.lock .box:after{content:"\1F512";position:absolute;right:-9px;bottom:-9px;font-size:13px}
.c.pop .box{-webkit-animation:pop .35s;animation:pop .35s}
.c.shake .box{-webkit-animation:shake .4s;animation:shake .4s}
@-webkit-keyframes pop{0%{-webkit-transform:scale(.7)}60%{-webkit-transform:scale(1.15)}100%{-webkit-transform:scale(1)}}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@-webkit-keyframes shake{0%,100%{-webkit-transform:translateX(0)}25%{-webkit-transform:translateX(-5px)}75%{-webkit-transform:translateX(5px)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.addrow{display:flex;align-items:center;min-height:var(--row-h);border:2px dashed var(--line);border-radius:12px;background:none;margin:8px 4px;padding:0 12px;font-weight:600;color:var(--accent)}
.empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:18px}
.empty .btn{margin-top:14px}
.narrow .dh{font-size:12px}
.narrow .dh b{font-size:13px}

/* ---------- Sparschwein ---------- */
.pf{display:flex;align-items:center;justify-content:center;padding:6px 4px;border-left:3px solid var(--line);min-width:0;flex-wrap:wrap}
.pf.empty-cell{border-left:0}
.pigwrap{position:relative;width:96px;height:74px;flex:0 0 auto}
.pig{width:96px;height:74px;-webkit-transform-origin:50% 90%;transform-origin:50% 90%}
.pig svg{display:block;width:96px;height:74px}
.pig.wobble{-webkit-animation:wobble .6s ease .45s;animation:wobble .6s ease .45s}
@-webkit-keyframes wobble{0%,100%{-webkit-transform:rotate(0)}20%{-webkit-transform:rotate(-7deg)}40%{-webkit-transform:rotate(6deg)}60%{-webkit-transform:rotate(-4deg)}80%{-webkit-transform:rotate(2deg)}}
@keyframes wobble{0%,100%{transform:rotate(0)}20%{transform:rotate(-7deg)}40%{transform:rotate(6deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(2deg)}}
.coin{position:absolute;left:35px;top:-30px;width:22px;height:22px;border-radius:50%;background:var(--gold);border:2px solid var(--gold-d);opacity:0;font-size:12px;font-weight:800;color:#7a5200;display:flex;align-items:center;justify-content:center}
.coin.drop{-webkit-animation:drop .55s ease-in;animation:drop .55s ease-in}
@-webkit-keyframes drop{0%{opacity:1;-webkit-transform:translateY(-20px)}85%{opacity:1;-webkit-transform:translateY(42px) scaleX(.4)}100%{opacity:0;-webkit-transform:translateY(48px) scaleX(.1)}}
@keyframes drop{0%{opacity:1;transform:translateY(-20px)}85%{opacity:1;transform:translateY(42px) scaleX(.4)}100%{opacity:0;transform:translateY(48px) scaleX(.1)}}
.pinfo{margin-left:10px;text-align:left;min-width:0}
.amount{font-size:26px;font-weight:800;white-space:nowrap}
.pinfo .btn{min-height:44px;padding:0 14px;margin:2px 0 0}

/* ---------- Dialoge ---------- */
.overlay{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(20,20,30,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:10px}
.dialog{background:#fff;border-radius:18px;max-width:560px;width:100%;max-height:100%;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.dialog.wide{max-width:900px;height:100%}
.dialog.small{max-width:360px}
.dlg-head{padding:12px 18px;border-bottom:1px solid var(--line);font-size:20px;font-weight:700;display:flex;align-items:center;flex:0 0 auto}
.dlg-head .grow{flex:1 1 auto;min-width:0}
.dlg-body{padding:12px 18px;overflow-y:auto;flex:1 1 auto;min-height:0;-webkit-overflow-scrolling:touch}
.dlg-foot{padding:8px 12px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;flex-wrap:wrap;flex:0 0 auto}
.dlg-foot .spacer{flex:1 1 auto}
.btn{min-height:48px;padding:0 18px;border-radius:12px;border:1px solid #d8d2c5;background:#fff;font-weight:600;margin:4px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--danger);border-color:#f0c4c0}
.btn.dangerfill{background:var(--danger);border-color:var(--danger);color:#fff}
.btn[disabled]{opacity:.4;cursor:default}
.sec{margin:6px 0 18px}
.sec h3{margin:0 0 8px;font-size:16px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.lbl{display:block;font-size:14px;color:var(--muted);margin:8px 0 4px}
.inp{min-height:48px;font-size:18px;padding:0 12px;border:1px solid #cfc8ba;border-radius:10px;background:#fff;width:100%}
.inp[disabled]{background:#f6f4ef;color:#444;border-color:#e5dfd3}
.inp.short{width:110px}
.inp.tiny{width:72px;text-align:center}
textarea.inp{min-height:140px;padding:10px;font-size:13px;font-family:monospace}
.row{display:flex;align-items:center;flex-wrap:wrap}
.row > *{margin-right:8px}
.chip{min-width:48px;min-height:48px;border-radius:24px;border:2px solid #ddd6c8;background:#fff;margin:3px;font-weight:600;padding:0 12px}
.chip.on{background:var(--pc);border-color:var(--pc);color:#fff}
.chip[disabled]{cursor:default}
.chip[disabled]:not(.on){opacity:.5}
.switch{min-height:48px;border:0;background:none;display:flex;align-items:center;padding:0 4px;font-weight:600}
.switch i{width:52px;height:30px;border-radius:15px;background:#cfc8ba;position:relative;margin-right:10px;flex:0 0 auto;display:inline-block}
.switch i:after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;-webkit-transition:left .15s;transition:left .15s}
.switch.on i{background:var(--pc)}
.switch.on i:after{left:25px}
.switch[disabled]{opacity:.6;cursor:default}
.emogrid{display:flex;flex-wrap:wrap;margin:4px 0}
.emo{width:48px;height:48px;font-size:26px;border:2px solid transparent;border-radius:10px;background:#f6f3ee;margin:2px;padding:0}
.emo.on{border-color:var(--accent);background:#e7efff}
.head-grid{display:flex;flex-wrap:wrap;align-items:flex-start}
.iconprev{width:84px;height:84px;border-radius:18px;background:#f6f3ee;display:flex;align-items:center;justify-content:center;margin:4px 16px 4px 0;flex:0 0 auto}
.iconprev .ticon.emo{width:64px;height:64px;font-size:50px}
.iconprev .ticon.ini{width:64px;height:64px;font-size:24px}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));grid-gap:12px}
.pcard{border:2px solid var(--line);border-radius:14px;padding:10px 12px}
.pcard.on{border-color:var(--pc)}
.pcard .pc-head{display:flex;align-items:center;justify-content:space-between}
.pcard .pc-name{display:flex;align-items:center;font-weight:700;font-size:17px}
.pcard .pc-name .avatar{margin-right:8px}
.preview{margin-top:8px;padding:8px 10px;background:#f6f3ee;border-radius:10px;font-weight:600}
.muted{color:var(--muted)}
.wd{font-weight:600;color:var(--accent);margin-left:6px}
.notice{background:#fff4d6;border-radius:10px;padding:8px 12px;margin-bottom:10px}
.errors{background:#fde2df;color:#7a1d16;border-radius:10px;padding:8px 12px;margin-bottom:10px}
.errors div{margin:2px 0}
.list-row{display:flex;align-items:center;border-bottom:1px solid var(--line);padding:4px 0}
.list-row .grow{flex:1 1 auto;min-width:0;margin:0 8px}
.iconbtn{min-width:48px;min-height:48px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:18px;margin:2px}
.iconbtn[disabled]{opacity:.3}
.colorbtn{width:48px;height:48px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line);margin:2px 6px 2px 2px}
.hist{margin-top:10px;max-height:200px;overflow-y:auto}
.hist div{display:flex;justify-content:space-between;padding:6px 2px;border-bottom:1px solid var(--line)}

/* PIN-Feld */
.pindots{display:flex;justify-content:center;margin:6px 0 4px;min-height:28px}
.pindots span{width:18px;height:18px;border-radius:50%;border:2px solid var(--ink);margin:0 6px}
.pindots span.f{background:var(--ink)}
.pinmsg{text-align:center;min-height:22px;color:var(--danger);font-size:15px}
.pinsub{text-align:center;color:var(--muted);font-size:15px;margin-bottom:4px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);grid-gap:8px;margin-top:6px}
.pad button{min-height:60px;border-radius:14px;border:1px solid var(--line);background:#f8f6f1;font-size:26px;font-weight:600}
.pad button.fn{font-size:18px;color:var(--muted)}
.shakebox{-webkit-animation:shake .4s;animation:shake .4s}

#toast{position:fixed;left:50%;bottom:120px;-webkit-transform:translateX(-50%);transform:translateX(-50%);background:rgba(30,30,40,.92);color:#fff;padding:12px 20px;border-radius:24px;font-size:16px;z-index:100;opacity:0;-webkit-transition:opacity .2s;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div id="tabs"></div>
    <div id="weeknav">
      <button class="navbtn" id="prevw" aria-label="Vorherige Woche">&#9664;</button>
      <div id="weeklabel"></div>
      <button class="navbtn" id="nextw" aria-label="Nächste Woche">&#9654;</button>
      <button class="navbtn today-btn" id="todayw">Heute</button>
    </div>
    <div id="lockind"></div>
    <button id="gear" aria-label="Einstellungen">&#9881;&#65039;</button>
  </header>
  <div id="banner"></div>
  <div id="board">
    <div id="ghead" class="grid"></div>
    <div id="gscroll"><div id="gbody" class="grid"></div><div id="gextra"></div></div>
    <div id="gfoot" class="grid"></div>
  </div>
</div>
<div id="modals"></div>
<div id="toast"></div>

<script>
(function () {
'use strict';

/* =====================================================================
   Konstanten
   ===================================================================== */
var STORE_KEY = 'haushaltsplaner.v2';
var UNLOCK_MS = 120000;           /* PIN-Entsperrung: 2 Minuten */
var PIN_MAX_FAILS = 5;
var PIN_BLOCK_MS = 30000;
var DAYS = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
var DAYS_LONG = ['Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag', 'Sonntag'];
var COLORS = ['#e4572e', '#2f6fde', '#2e9b57', '#9b51e0', '#f08a24', '#d63384', '#1597a8', '#6b7280'];
var EMOJI = ['🧹', '🍽️', '🗑️', '🛏️', '👕', '🧺', '🧦', '🌱', '🐶', '🐱', '🐟', '📚',
             '✏️', '🎒', '🦷', '🛁', '🚿', '🧽', '🥕', '🍎', '🚲', '🧸', '🎹', '⚽',
             '📦', '🛒', '💤', '⭐', '🚪', '🪥'];

/* =====================================================================
   Hilfsfunktionen: Datum (reines Datum, gerechnet in UTC-Mitternacht)
   ===================================================================== */
function pad2(n) { return (n < 10 ? '0' : '') + n; }
function localDateStr(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function todayStr() { return localDateStr(new Date()); }
function toUTC(s) { var p = s.split('-'); return Date.UTC(+p[0], +p[1] - 1, +p[2]); }
function fromUTC(ms) { var d = new Date(ms); return d.getUTCFullYear() + '-' + pad2(d.getUTCMonth() + 1) + '-' + pad2(d.getUTCDate()); }
function addDays(s, n) { return fromUTC(toUTC(s) + n * 86400000); }
function diffDays(a, b) { return Math.round((toUTC(a) - toUTC(b)) / 86400000); } /* a - b */
function isoDay(s) { return ((new Date(toUTC(s)).getUTCDay() + 6) % 7) + 1; }  /* 1 = Mo … 7 = So */
function weekStart(s) { return addDays(s, 1 - isoDay(s)); }
function isoWeek(s) {
  var thu = addDays(s, 4 - isoDay(s));
  return Math.floor(diffDays(thu, thu.slice(0, 4) + '-01-01') / 7) + 1;
}
function validDate(s) { return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && fromUTC(toUTC(s)) === s; }
function fmtDate(s) { var p = s.split('-'); return p[2] + '.' + p[1] + '.' + p[0]; }
function fmtDM(s) { var p = s.split('-'); return +p[2] + '.' + (+p[1]) + '.'; }
function nowLocalIso() { var d = new Date(); return localDateStr(d) + 'T' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds()); }

/* =====================================================================
   Hilfsfunktionen: Geld (intern in Cent)
   ===================================================================== */
function cents(v) { return Math.round((+v || 0) * 100); }
function moneyPlain(c) { return Math.floor(c / 100) + ',' + pad2(c % 100); }
function fmtMoney(c) { var neg = c < 0; c = Math.abs(c); return (neg ? '−' : '') + moneyPlain(c) + ' €'; }
function parseMoney(str) {
  str = String(str == null ? '' : str).replace(/€/g, '').replace(/\s/g, '').replace(',', '.');
  if (!/^\d+(\.\d{0,2})?$/.test(str)) return NaN;
  return Math.round(parseFloat(str) * 100);
}

/* =====================================================================
   SHA-256 (für den PIN-Hash; crypto.subtle fehlt unter file:// oft)
   ===================================================================== */
var SHA_K = [], SHA_H = [];
(function () {
  function frac(x) { return ((x - Math.floor(x)) * 4294967296) | 0; }
  var n = 2, c = 0;
  while (c < 64) {
    var prime = true;
    for (var f = 2; f * f <= n; f++) { if (n % f === 0) { prime = false; break; } }
    if (prime) { if (c < 8) SHA_H[c] = frac(Math.pow(n, 1 / 2)); SHA_K[c] = frac(Math.pow(n, 1 / 3)); c++; }
    n++;
  }
})();
function sha256(msg) {
  function rotr(x, n) { return (x >>> n) | (x << (32 - n)); }
  var bytes = unescape(encodeURIComponent(msg));
  var l = bytes.length, words = [], i, j;
  var nw = (((l + 8) >> 6) << 4) + 16;
  for (i = 0; i < nw; i++) words[i] = 0;
  for (i = 0; i < l; i++) words[i >> 2] |= (bytes.charCodeAt(i) & 0xff) << (24 - (i % 4) * 8);
  words[l >> 2] |= 0x80 << (24 - (l % 4) * 8);
  words[nw - 1] = l * 8;
  var hash = SHA_H.slice(0);
  for (j = 0; j < nw; j += 16) {
    var w = words.slice(j, j + 16), a = hash.slice(0);
    for (i = 0; i < 64; i++) {
      if (i >= 16) {
        var w15 = w[i - 15], w2 = w[i - 2];
        w[i] = (w[i - 16] + (rotr(w15, 7) ^ rotr(w15, 18) ^ (w15 >>> 3)) + w[i - 7] +
                (rotr(w2, 17) ^ rotr(w2, 19) ^ (w2 >>> 10))) | 0;
      }
      var e = a[4], a0 = a[0];
      var t1 = (a[7] + (rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25)) + ((e & a[5]) ^ (~e & a[6])) + SHA_K[i] + w[i]) | 0;
      var t2 = ((rotr(a0, 2) ^ rotr(a0, 13) ^ rotr(a0, 22)) + ((a0 & a[1]) ^ (a0 & a[2]) ^ (a[1] & a[2]))) | 0;
      a = [(t1 + t2) | 0].concat(a);
      a[4] = (a[4] + t1) | 0;
      a.pop();
    }
    for (i = 0; i < 8; i++) hash[i] = (hash[i] + a[i]) | 0;
  }
  var out = '';

    return {

/* --- IndexedDB als zweite Ablage (falls localStorage unter file:// unzuverlässig ist) --- */

}

}

/* =====================================================================
   Zeitplan-Logik
   ===================================================================== */
function isDue(sch, date) {
  if (!sch) return false;
  if (sch.type === 'weekdays') return sch.days.indexOf(isoDay(date)) >= 0;
  if (sch.type === 'interval') {
    var d = diffDays(date, sch.start);
    return d >= 0 && d % sch.everyDays === 0;
  }
  return false;
}
function intervalText(n) {
  if (n === 1) return 'täglich';
  if (n % 7 === 0) return n === 7 ? 'jede Woche' : 'alle ' + (n / 7) + ' Wochen';
  return 'alle ' + n + ' Tage';
}
function schedText(sch) {
  if (!sch) return '';
  if (sch.type === 'weekdays') {
    var ds = sch.days.slice().sort();
    if (!ds.length) return 'keine Tage gewählt';
    if (ds.length === 7) return 'täglich';
    if (ds.join() === '1,2,3,4,5') return 'Mo–Fr';
    if (ds.join() === '6,7') return 'Sa, So';
    return ds.map(function (d) { return DAYS[d - 1]; }).join(', ');
  }
  if (!(sch.everyDays >= 1) || !validDate(sch.start)) return 'unvollständig';
  return intervalText(sch.everyDays) + ' ab ' + DAYS[isoDay(sch.start) - 1] + ' ' + fmtDate(sch.start);
}

/* Nummernfeld. onSubmit(pin, api) mit api.fail(msg) / api.close() */
function pinPad(opts) {
  var m = openModal('small');
  var val = '';
  var dots = h('div', { class: 'pindots' });
  var msg = h('div', { class: 'pinmsg' });
  var box = h('div');
  var parts = dialogParts(m, opts.title);
  function paint() {
    dots.innerHTML = '';
    var n = Math.max(4, val.length);
    for (var i = 0; i < n; i++) dots.appendChild(h('span', { class: i < val.length ? 'f' : '' }));
  }
  var api = {
    fail: function (t) {
      msg.textContent = t; val = ''; paint();
      box.className = ''; void box.offsetWidth; box.className = 'shakebox';
    },
    close: function () { document.removeEventListener('keydown', onKey); m.close(); }
  };
  function press(k) {
    msg.textContent = '';
    if (k === 'del') val = val.slice(0, -1);
    else if (k === 'ok') {
      if (val.length < 4) { api.fail('Mindestens 4 Ziffern'); return; }

    } else if (val.length < 8) val += k;
    paint();
  }
  function onKey(e) {
    if (e.key >= '0' && e.key <= '9') press(e.key);
    else if (e.key === 'Backspace') press('del');
    else if (e.key === 'Enter') press('ok');
    else if (e.key === 'Escape' && !opts.noCancel) api.close();
  }
  document.addEventListener('keydown', onKey);
  var keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'del', '0', 'ok'];
  var padEl = h('div', { class: 'pad' }, keys.map(function (k) {
    var label = k === 'del' ? '⌫' : k === 'ok' ? 'OK' : k;
    return h('button', { class: k === 'del' || k === 'ok' ? 'fn' : '', onclick: function () { press(k); } }, label);
  }));
  appendKids(box, [opts.sub ? h('div', { class: 'pinsub' }, opts.sub) : null, dots, msg, padEl]);
  parts.body.appendChild(box);
  if (!opts.noCancel) parts.foot.appendChild(h('button', { class: 'btn', onclick: function () { api.close(); if (opts.onCancel) opts.onCancel(); } }, 'Abbrechen'));
  else parts.foot.style.display = 'none';

}

function computeRows(profs, dates) {
  var rows = [];
  sortedTasks().forEach(function (t) {
    var assigned = profs.map(function (p) { return getAssign(t.id, p.id); });
    var anyAssigned = assigned.some(Boolean);
    var anyDone = profs.some(function (p) { return dates.some(function (d) { return findCompletion(p.id, t.id, d) >= 0; }); });
    var orphan = !hasAnyAssign(t.id);
    if (!anyAssigned && !anyDone && !orphan) return;
    rows.push({ task: t, assigned: assigned, shared: assigned.every(Boolean), orphan: orphan });
  });
  rows.sort(function (a, b) {
    if (a.shared !== b.shared) return a.shared ? -1 : 1;
    if (a.orphan !== b.orphan) return a.orphan ? 1 : -1;
    return a.task.order - b.task.order;
  });
  return rows;
}

  var cols = 'var(--task-w) repeat(' + (profs.length * 7) + ', minmax(0,1fr))';
  head.style.gridTemplateColumns = cols;
  body.style.gridTemplateColumns = cols;
  foot.style.gridTemplateColumns = 'var(--task-w) repeat(' + profs.length + ', minmax(0,1fr))';

  /* Kopf: Profilnamen + Tagesspalten */
  head.appendChild(h('div', { class: 'th', style: { 'grid-column': '1' } }, 'Aufgaben'));
  profs.forEach(function (p, pi) {
    head.appendChild(h('div', { class: 'ph', style: { 'grid-column': (2 + pi * 7) + ' / span 7', color: p.color } },
      [avatarEl(p), h('span', { class: 'nm' }, p.name)]));
    dates.forEach(function (d, di) {
      head.appendChild(h('div', {
        class: 'dh' + (di === 0 ? ' pstart' : '') + (d === ui.today ? ' today' : ''),
        style: { 'grid-column': String(2 + pi * 7 + di) }
      }, [h('b', null, DAYS[di]), fmtDM(d)]));
    });
  });

  /* Zeilen */
  var rows = computeRows(profs, dates);
  var firstSpecDone = false;
  rows.forEach(function (r) {
    var t = r.task;
    var spec = !r.shared && !firstSpecDone && rows[0] !== r;
    if (!r.shared) firstSpecDone = true;
    var sub = r.orphan ? 'nicht zugeordnet' : fmtMoney(cents(t.value));
    body.appendChild(h('button', {
      class: 'tcell' + (spec ? ' row-first-spec' : ''), 'data-task': t.id, 'aria-label': 'Aufgabe ' + t.title + ' öffnen'
    }, [taskIcon(t.icon, t.title), h('span', { class: 'tx' }, [h('span', { class: 'tt' }, t.title), h('span', { class: 'tv' }, sub)])]));
    profs.forEach(function (p, pi) {
      var a = r.assigned[pi];
      dates.forEach(function (d, di) {
        var el = h('button', {
          'data-t': t.id, 'data-p': p.id, 'data-d': d, 'data-ps': di === 0 ? '1' : '0', 'data-sep': spec ? '1' : '0',
          style: { '--pc': p.color }, 'aria-label': t.title + ', ' + p.name + ', ' + DAYS[di] + ' ' + fmtDM(d)
        });
        paintCell(el, cellInfo(t, p, a, d), a, d === ui.today);
        body.appendChild(el);
      });
    });
  });

  if (!rows.length) {
    extra.appendChild(h('div', { class: 'empty' }, [
      h('div', null, data.tasks.length ? 'Für diese Ansicht sind keine Aufgaben zugeordnet.' : 'Noch keine Aufgaben angelegt.'),
      !data.tasks.length ? h('button', { class: 'btn', onclick: function () { requirePin(createSampleTasks); } }, 'Beispielaufgaben anlegen') : null
    ]));
  }
  extra.appendChild(h('button', { class: 'addrow', style: { width: 'calc(var(--task-w) - 8px)' }, onclick: function () { requirePin(function () { openTaskMask(null); }); } }, '+ Neue Aufgabe'));

  /* Fuß: Sparschweine */
  foot.appendChild(h('div', { class: 'pf empty-cell' }));
  profs.forEach(function (p) {
    var pg = piggies[p.id];
    if (!pg) pg = piggies[p.id] = makePiggy(p);
    pg.update(p);
    foot.appendChild(pg.root);
  });
  boardCtx = { profs: profs, dates: dates };
}

/* Antippen im Raster (Event-Delegation) */
$('gbody').addEventListener('click', function (e) {
  var tc = e.target.closest ? e.target.closest('[data-task]') : null;
  if (tc) { openTaskMask(tc.getAttribute('data-task')); return; }
  var c = e.target.closest ? e.target.closest('[data-d]') : null;
  if (!c || c.disabled) return;
  onCellTap(c);
});

function onCellTap(el) {
  var t = taskById(el.getAttribute('data-t'));
  var p = profileById(el.getAttribute('data-p'));
  var d = el.getAttribute('data-d');
  if (!t || !p) return;
  if (d > ui.today) {
    el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
    toast('Zukünftige Tage sind gesperrt.');
    return;
  }
  if (d < ui.today && !isUnlocked()) {
    requirePin(function () { toggleCompletion(t, p, d); }, 'Vergangenen Tag ändern');
    return;
  }
  toggleCompletion(t, p, d);
}

function toggleCompletion(t, p, d) {
  var before = balance(p.id);
  var idx = findCompletion(p.id, t.id, d);
  var a = getAssign(t.id, p.id);
  var added = idx < 0;
  if (added) data.completions.push({ profileId: p.id, taskId: t.id, date: d, value: valueFor(t, a) / 100 });
  else data.completions.splice(idx, 1);
  save();
  /* betroffene Zelle neu zeichnen (ohne kompletten Neuaufbau) */
  var el = null, cand = $('gbody').querySelectorAll('[data-d="' + d + '"]');
  for (var i = 0; i < cand.length; i++) {
    if (cand[i].getAttribute('data-t') === t.id && cand[i].getAttribute('data-p') === p.id) { el = cand[i]; break; }
  }
  if (el) {
    var info = cellInfo(t, p, a, d);
    if (!info.active) renderBoard();          /* z. B. Haken zurückgenommen an nicht mehr fälligem Tag */
    else {
      paintCell(el, info, a, d === ui.today);
      if (added) { el.classList.add('pop'); }
    }
  }
  var pg = piggies[p.id];
  if (pg) pg.animateTo(before, balance(p.id), added);
}

/* =====================================================================
   Sparschwein (SVG + CSS-Animation)
   ===================================================================== */
var PIG_SVG =
  '<svg viewBox="0 0 130 100" aria-hidden="true">' +
  '<defs><clipPath id="CLIP"><ellipse cx="62" cy="56" rx="44" ry="32"/></clipPath></defs>' +
  '<rect x="30" y="76" width="11" height="17" rx="3" fill="#e486a6"/><rect x="46" y="78" width="11" height="16" rx="3" fill="#d9799b"/>' +
  '<rect x="70" y="78" width="11" height="16" rx="3" fill="#d9799b"/><rect x="86" y="76" width="11" height="17" rx="3" fill="#e486a6"/>' +
  '<path d="M19 54 q-11 -2 -8 -11 q3 -6 9 -2" fill="none" stroke="#e486a6" stroke-width="3.5" stroke-linecap="round"/>' +
  '<ellipse cx="62" cy="56" rx="44" ry="32" fill="#f8b4c9"/>' +
  '<rect class="fill" x="0" y="88" width="130" height="0" fill="#f2b632" opacity=".9" clip-path="url(#CLIP)"/>' +
  '<ellipse cx="62" cy="56" rx="44" ry="32" fill="none" stroke="#d9799b" stroke-width="2.5"/>' +
  '<path d="M80 29 l9 -15 l9 18 z" fill="#f08bb0" stroke="#d9799b" stroke-width="2" stroke-linejoin="round"/>' +
  '<ellipse cx="105" cy="58" rx="10" ry="8.5" fill="#f08bb0" stroke="#d9799b" stroke-width="2"/>' +
  '<ellipse cx="102" cy="58" rx="1.8" ry="2.6" fill="#a8466c"/><ellipse cx="108" cy="58" rx="1.8" ry="2.6" fill="#a8466c"/>' +
  '<circle cx="90" cy="45" r="3.4" fill="#333"/>' +
  '<rect x="51" y="24" width="22" height="5" rx="2.5" fill="#8a3d5a"/>' +
  '</svg>';

function makePiggy(p) {
  var pigEl = h('div', { class: 'pig' });
  pigEl.innerHTML = PIG_SVG.replace(/CLIP/g, 'clip-' + p.id.replace(/[^A-Za-z0-9_-]/g, ''));
  var coin = h('div', { class: 'coin' }, '€');
  var amount = h('div', { class: 'amount' });
  var btn = h('button', { class: 'btn', onclick: function () { openPayout(profileById(p.id)); } }, 'Auszahlen');
  var root = h('div', { class: 'pf' }, [h('div', { class: 'pigwrap' }, [pigEl, coin]), h('div', { class: 'pinfo' }, [amount, btn])]);
  var fillRect = pigEl.querySelector('.fill');
  var shown = null, raf = null;

  function draw(c) {
    amount.textContent = fmtMoney(c);
    var full = Math.max(1, cents(data.settings.piggyFull));
    var frac = Math.max(0, Math.min(1, c / full));
    var hgt = c > 0 ? Math.max(5, 64 * frac) : 0;   /* kleines Guthaben bleibt sichtbar */
    fillRect.setAttribute('y', String(88 - hgt));
    fillRect.setAttribute('height', String(hgt));
  }
  function update(prof) {
    root.style.setProperty('--pc', prof.color);
    if (raf) return;
    shown = balance(prof.id);
    draw(shown);
  }
  function animateTo(from, to, withCoin) {
    if (raf) { cancelAnimationFrame(raf); raf = null; }
    if (withCoin) {
      coin.classList.remove('drop'); pigEl.classList.remove('wobble');
      void coin.offsetWidth;
      coin.classList.add('drop'); pigEl.classList.add('wobble');
    }
    var delay = withCoin ? 450 : 0, dur = 650, t0 = null;
    function step(ts) {
      if (t0 === null) t0 = ts;
      var k = (ts - t0 - delay) / dur;
      if (k < 0) k = 0;
      if (k > 1) k = 1;
      var e = 1 - Math.pow(1 - k, 3);
      shown = Math.round(from + (to - from) * e);
      draw(shown);
      if (k < 1) raf = requestAnimationFrame(step); else raf = null;
    }
    raf = requestAnimationFrame(step);
  }
  return { root: root, update: update, animateTo: animateTo };
}

}

/* =====================================================================
   Aufgabenmaske (Lesemodus / Bearbeiten mit PIN)
   ===================================================================== */
function openTaskMask(taskId) {
  var isNew = !taskId;
  var t = isNew ? { id: uid('t'), title: '', icon: '', value: 0.5, order: nextOrder() } : taskById(taskId);
  if (!t) return;
  var editing = false, draft = null, notice = '', errors = [];
  var m = openModal('wide');
  var refs = {};

  function loadDraft() {
    draft = { title: t.title, icon: t.icon || '', value: moneyPlain(cents(t.value)), cards: {} };
    data.profiles.forEach(function (p) {
      var a = isNew ? null : getAssign(t.id, p.id);
      var s = a ? a.schedule : null;
      draft.cards[p.id] = {
        on: !!a,
        type: s ? s.type : 'weekdays',
        days: s && s.days ? s.days.slice() : [],
        every: s && s.everyDays ? String(s.everyDays) : '2',
        start: s && s.start ? s.start : ui.today,
        ov: !!(a && a.valueOverride !== null),
        ovVal: a && a.valueOverride !== null ? moneyPlain(cents(a.valueOverride)) : ''
      };
    });
  }
  function startEditing() { if (!editing) { editing = true; ui.protectedOpen++; } notice = ''; build(); }
  function stopEditing() { if (editing) { editing = false; ui.protectedOpen--; } }
  function close() {
    stopEditing();
    var i = lockListeners.indexOf(onLock);
    if (i >= 0) lockListeners.splice(i, 1);
    m.close();
  }
  function onLock() {
    if (!editing) return;
    if (isNew) { close(); toast('Entsperrung abgelaufen – Aufgabe nicht gespeichert.'); return; }
    stopEditing(); loadDraft(); errors = [];
    notice = 'Die Entsperrung ist abgelaufen. Nicht gespeicherte Änderungen wurden verworfen.';
    build();
  }
  lockListeners.push(onLock);

  function cardSchedule(c) {
    if (c.type === 'weekdays') return { type: 'weekdays', days: c.days.slice().sort() };
    var n = parseInt(c.every, 10);
    return { type: 'interval', everyDays: n >= 1 ? n : 0, start: c.start };
  }
  function updatePreview(pid) {
    var r = refs[pid];
    if (!r) return;
    var c = draft.cards[pid];
    if (r.preview) r.preview.textContent = '→ ' + schedText(cardSchedule(c));
    if (r.wd) r.wd.textContent = validDate(c.start) ? DAYS_LONG[isoDay(c.start) - 1] : '';
  }

  function build() {
    var oldBody = m.dlg.querySelector('.dlg-body');
    var sc = oldBody ? oldBody.scrollTop : 0;
    refs = {};
    var title = isNew ? 'Neue Aufgabe' : (editing ? 'Aufgabe bearbeiten' : 'Aufgabe');
    var parts = dialogParts(m, title, editing ? h('span', { class: 'muted', style: { 'font-size': '15px', 'font-weight': '400' } }, '🔓 Bearbeitungsmodus') : null);
    var dis = !editing;

    if (notice) parts.body.appendChild(h('div', { class: 'notice' }, notice));
    if (errors.length) parts.body.appendChild(h('div', { class: 'errors' }, errors.map(function (x) { return h('div', null, '• ' + x); })));

    /* --- Kopfbereich --- */
    var preview = h('div', { class: 'iconprev' }, taskIcon(draft.icon, draft.title));
    function refreshIcon() { preview.innerHTML = ''; preview.appendChild(taskIcon(draft.icon, draft.title)); }
    var nameInp = h('input', { class: 'inp', value: draft.title, disabled: dis, maxlength: '40', placeholder: 'z. B. Zimmer aufräumen',
      oninput: function () { draft.title = nameInp.value; refreshIcon(); } });
    var valInp = h('input', { class: 'inp short', value: draft.value, disabled: dis, inputmode: 'decimal',
      oninput: function () { draft.value = valInp.value; } });
    var head = h('div', { class: 'sec' }, [
      h('div', { class: 'head-grid' }, [
        preview,
        h('div', { style: { flex: '1 1 260px', 'min-width': '0' } }, [
          h('label', { class: 'lbl' }, 'Name'), nameInp,
          h('label', { class: 'lbl' }, 'Standardwert (€)'),
          h('div', { class: 'row' }, [valInp, h('span', { class: 'muted' }, 'je Erledigung')])
        ])
      ])
    ]);
    parts.body.appendChild(head);

    /* --- Symbol --- */
    var symSec = h('div', { class: 'sec' }, [h('h3', null, 'Symbol')]);
    if (editing) {
      symSec.appendChild(h('div', { class: 'emogrid' }, EMOJI.map(function (e) {
        return h('button', { class: 'emo' + (draft.icon === e ? ' on' : ''), onclick: function () { draft.icon = e; build(); } }, e);
      })));
      var freeInp = h('input', { class: 'inp short', value: EMOJI.indexOf(draft.icon) < 0 ? draft.icon : '', placeholder: 'eigenes', maxlength: '8',
        oninput: function () { draft.icon = freeInp.value.trim(); refreshIcon(); } });
      symSec.appendChild(h('div', { class: 'row' }, [
        h('span', { class: 'muted' }, 'Eigenes Zeichen:'), freeInp,
        h('button', { class: 'btn', onclick: function () { draft.icon = ''; build(); } }, 'Symbol entfernen')
      ]));
    } else {
      symSec.appendChild(h('div', { class: 'muted' }, draft.icon ? 'Symbol: ' + draft.icon : 'Kein Symbol – es werden die Initialen „' + initials(draft.title) + '“ angezeigt.'));
    }
    parts.body.appendChild(symSec);

    /* --- Wiederkehrende Parameter je Profil --- */
    var cardsSec = h('div', { class: 'sec' }, [h('h3', null, 'Wiederkehrende Parameter je Profil')]);
    if (!data.profiles.length) cardsSec.appendChild(h('div', { class: 'muted' }, 'Es sind noch keine Profile angelegt (⚙️ → Profile).'));
    var grid = h('div', { class: 'pcards' });
    data.profiles.forEach(function (p) {
      var c = draft.cards[p.id];
      var r = refs[p.id] = {};
      var card = h('div', { class: 'pcard' + (c.on ? ' on' : ''), style: { '--pc': p.color } });
      card.appendChild(h('div', { class: 'pc-head' }, [
        h('div', { class: 'pc-name' }, [avatarEl(p), p.name]),
        h('button', { class: 'switch' + (c.on ? ' on' : ''), disabled: dis, onclick: function () { c.on = !c.on; build(); } }, [h('i'), 'Zugeordnet'])
      ]));
      if (c.on) {
        card.appendChild(h('div', { class: 'row', style: { 'margin-top': '6px' } }, [
          h('button', { class: 'chip' + (c.type === 'weekdays' ? ' on' : ''), disabled: dis, onclick: function () { c.type = 'weekdays'; build(); } }, 'Wochentage'),
          h('button', { class: 'chip' + (c.type === 'interval' ? ' on' : ''), disabled: dis, onclick: function () { c.type = 'interval'; build(); } }, 'Intervall')
        ]));
        if (c.type === 'weekdays') {
          card.appendChild(h('div', { class: 'row' }, DAYS.map(function (dn, i) {
            var day = i + 1, on = c.days.indexOf(day) >= 0;
            return h('button', { class: 'chip' + (on ? ' on' : ''), disabled: dis, onclick: function () {
              if (on) c.days.splice(c.days.indexOf(day), 1); else c.days.push(day);
              build();
            } }, dn);
          })));
          if (editing) card.appendChild(h('div', { class: 'row' }, [
            h('button', { class: 'chip', onclick: function () { c.days = [1, 2, 3, 4, 5, 6, 7]; build(); } }, 'täglich'),
            h('button', { class: 'chip', onclick: function () { c.days = [1, 2, 3, 4, 5]; build(); } }, 'Mo–Fr'),
            h('button', { class: 'chip', onclick: function () { c.days = [6, 7]; build(); } }, 'Wochenende')
          ]));
        } else {
          var evInp = h('input', { class: 'inp tiny', type: 'number', min: '1', step: '1', inputmode: 'numeric', value: c.every, disabled: dis,
            oninput: function () { c.every = evInp.value; updatePreview(p.id); } });
          card.appendChild(h('div', { class: 'row', style: { 'margin-top': '6px' } }, [h('span', null, 'alle'), evInp, h('span', null, 'Tage')]));
          if (editing) card.appendChild(h('div', { class: 'row' }, [[1, '1 Tag'], [2, '2 Tage'], [3, '3 Tage'], [7, '1 Woche'], [14, '2 Wochen']].map(function (q) {
            return h('button', { class: 'chip' + (String(q[0]) === String(c.every) ? ' on' : ''), onclick: function () { c.every = String(q[0]); build(); } }, q[1]);
          })));
          var stInp = h('input', { class: 'inp', type: 'date', value: c.start, disabled: dis, style: { width: '190px' },
            oninput: function () { c.start = stInp.value; updatePreview(p.id); },
            onchange: function () { c.start = stInp.value; updatePreview(p.id); } });
          r.wd = h('span', { class: 'wd' });
          card.appendChild(h('label', { class: 'lbl' }, 'Startdatum'));
          card.appendChild(h('div', { class: 'row' }, [stInp, r.wd]));
        }
        /* abweichender Wert */
        var ovInp = h('input', { class: 'inp short', inputmode: 'decimal', value: c.ovVal, disabled: dis, placeholder: draft.value,
          oninput: function () { c.ovVal = ovInp.value; } });
        card.appendChild(h('div', { class: 'row', style: { 'margin-top': '4px' } }, [
          h('button', { class: 'switch' + (c.ov ? ' on' : ''), disabled: dis, onclick: function () { c.ov = !c.ov; if (c.ov && !c.ovVal) c.ovVal = draft.value; build(); } }, [h('i'), 'abweichender Wert']),
          c.ov ? ovInp : null, c.ov ? h('span', null, '€') : null
        ]));
        r.preview = h('div', { class: 'preview' });
        card.appendChild(r.preview);
      } else if (!editing) {
        card.appendChild(h('div', { class: 'muted', style: { 'margin-top': '6px' } }, 'nicht zugeordnet'));
      }
      grid.appendChild(card);
      updatePreview(p.id);
    });
    cardsSec.appendChild(grid);
    parts.body.appendChild(cardsSec);

    /* --- Fußleiste --- */
    if (editing) {
      appendKids(parts.foot, [
        !isNew ? h('button', { class: 'btn danger', onclick: doDelete }, 'Löschen') : null,
        h('span', { class: 'spacer' }),
        h('button', { class: 'btn', onclick: function () { if (isNew) close(); else { stopEditing(); loadDraft(); errors = []; build(); } } }, 'Abbrechen'),
        h('button', { class: 'btn primary', onclick: doSave }, 'Speichern')
      ]);
    } else {
      appendKids(parts.foot, [
        h('span', { class: 'spacer' }),
        h('button', { class: 'btn', onclick: close }, 'Schließen'),
        h('button', { class: 'btn primary', onclick: function () { requirePin(startEditing, 'Aufgabe bearbeiten'); } }, '🔒 Bearbeiten')
      ]);
    }
    parts.body.scrollTop = sc;
  }

  function doSave() {
    errors = [];
    var title = draft.title.trim();
    var val = parseMoney(draft.value);
    if (!title) errors.push('Der Name darf nicht leer sein.');
    if (isNaN(val) || val < 0) errors.push('Der Standardwert muss eine Zahl ≥ 0 sein (z. B. 0,50).');
    var plans = {};
    data.profiles.forEach(function (p) {
      var c = draft.cards[p.id];
      if (!c.on) return;
      var sch = cardSchedule(c);
      if (sch.type === 'weekdays' && !sch.days.length) errors.push(p.name + ': mindestens einen Wochentag wählen.');
      if (sch.type === 'interval') {
        var n = Number(c.every);
        if (!(n >= 1) || Math.floor(n) !== n) errors.push(p.name + ': Intervall muss eine ganze Zahl ≥ 1 sein.');
        if (!validDate(sch.start)) errors.push(p.name + ': gültiges Startdatum angeben.');
      }
      var ov = null;
      if (c.ov) {
        ov = parseMoney(c.ovVal);
        if (isNaN(ov) || ov < 0) errors.push(p.name + ': abweichender Wert muss eine Zahl ≥ 0 sein.');
      }
      plans[p.id] = { schedule: sch, ov: c.ov ? ov / 100 : null };
    });
    if (errors.length) { build(); m.dlg.querySelector('.dlg-body').scrollTop = 0; return; }

    t.title = title;
    t.icon = draft.icon;
    t.value = val / 100;
    if (isNew) { data.tasks.push(t); isNew = false; }
    data.profiles.forEach(function (p) {
      var a = getAssign(t.id, p.id), plan = plans[p.id];
      if (plan) {
        if (!a) { a = { id: uid('a'), taskId: t.id, profileId: p.id }; data.assignments.push(a); }
        a.schedule = plan.schedule;
        a.valueOverride = plan.ov;
      } else if (a) {
        data.assignments.splice(data.assignments.indexOf(a), 1);
      }
    });
    save();
    close();
    renderBoard();
    toast('Aufgabe gespeichert');
  }

  function doDelete() {
    confirmDlg('Aufgabe löschen?', '„' + t.title + '“ und alle Zuordnungen werden gelöscht. Bereits erledigte Einträge bleiben im Sparschwein erhalten.', 'Löschen', true, function () {
      data.tasks.splice(data.tasks.indexOf(t), 1);
      data.assignments = data.assignments.filter(function (a) { return a.taskId !== t.id; });
      renumberTasks();
      save();
      close();
      renderBoard();
      toast('Aufgabe gelöscht');
    });
  }

  loadDraft();
  if (isNew) { editing = true; ui.protectedOpen++; }
  build();
}

/* =====================================================================
   Verwaltungsbereich (hinter Zahnrad)
   ===================================================================== */
function openSettings() {
  var m = openModal('wide');
  ui.protectedOpen++;
  var exportText = null;
  function close() {
    ui.protectedOpen--;
    var i = lockListeners.indexOf(onLock);
    if (i >= 0) lockListeners.splice(i, 1);
    m.close();
    renderAll();
  }
  function onLock() { close(); toast('Einstellungen gesperrt (Zeit abgelaufen).'); }
  lockListeners.push(onLock);

  function build() {
    var oldBody = m.dlg.querySelector('.dlg-body');
    var sc = oldBody ? oldBody.scrollTop : 0;
    var parts = dialogParts(m, 'Einstellungen');
    var b = parts.body;

    /* Profile */
    var ps = h('div', { class: 'sec' }, [h('h3', null, 'Profile')]);
    data.profiles.forEach(function (p, i) {
      var nameInp = h('input', { class: 'inp', value: p.name, maxlength: '24',
        onchange: function () { var v = nameInp.value.trim(); if (v) { p.name = v; save(); } else nameInp.value = p.name; } });
      var avInp = h('input', { class: 'inp tiny', value: p.avatar, maxlength: '4', placeholder: initials(p.name).charAt(0),
        onchange: function () { p.avatar = avInp.value.trim(); save(); } });
      ps.appendChild(h('div', { class: 'list-row' }, [
        h('button', { class: 'colorbtn', style: { background: p.color }, 'aria-label': 'Farbe wechseln',
          onclick: function () { var k = COLORS.indexOf(p.color); p.color = COLORS[(k + 1) % COLORS.length]; save(); build(); } }),
        avInp,
        h('div', { class: 'grow' }, nameInp),
        h('button', { class: 'iconbtn', disabled: i === 0, onclick: function () { move(data.profiles, i, -1); save(); build(); } }, '▲'),
        h('button', { class: 'iconbtn', disabled: i === data.profiles.length - 1, onclick: function () { move(data.profiles, i, 1); save(); build(); } }, '▼'),
        h('button', { class: 'iconbtn', onclick: function () { deleteProfile(p); } }, '🗑️')
      ]));
    });
    ps.appendChild(h('button', { class: 'btn', onclick: function () {
      var n = data.profiles.length;
      data.profiles.push({ id: uid('p'), name: 'Profil ' + (n + 1), color: COLORS[n % COLORS.length], avatar: '', pinned: false, payouts: [] });
      save(); build();
    } }, '+ Profil hinzufügen'));
    ps.appendChild(h('div', { class: 'muted', style: { 'font-size': '14px', 'margin-top': '4px' } }, 'Farbkreis antippen, um die Farbe zu wechseln. Das kleine Feld nimmt ein Emoji oder einen Buchstaben als Avatar auf.'));
    b.appendChild(ps);

    /* Aufgabenreihenfolge */
    var ts = h('div', { class: 'sec' }, [h('h3', null, 'Aufgabenreihenfolge')]);
    var st = sortedTasks();
    if (!st.length) ts.appendChild(h('div', { class: 'muted' }, 'Noch keine Aufgaben. Neue Aufgaben über „+ Neue Aufgabe“ im Dashboard anlegen.'));
    st.forEach(function (t, i) {
      ts.appendChild(h('div', { class: 'list-row' }, [
        taskIcon(t.icon, t.title),
        h('div', { class: 'grow' }, t.title),
        h('button', { class: 'iconbtn', disabled: i === 0, onclick: function () { swapOrder(st, i, i - 1); save(); build(); } }, '▲'),
        h('button', { class: 'iconbtn', disabled: i === st.length - 1, onclick: function () { swapOrder(st, i, i + 1); save(); build(); } }, '▼')
      ]));
    });
    ts.appendChild(h('div', { class: 'muted', style: { 'font-size': '14px', 'margin-top': '4px' } }, 'Aufgaben selbst und ihre Zeitpläne werden über die Aufgabenmaske gepflegt (Aufgabe im Dashboard antippen).'));
    b.appendChild(ts);

    /* Sparschwein */
    var fullInp = h('input', { class: 'inp short', inputmode: 'decimal', value: moneyPlain(cents(data.settings.piggyFull)),
      onchange: function () { var c = parseMoney(fullInp.value); if (c > 0) { data.settings.piggyFull = c / 100; save(); } else fullInp.value = moneyPlain(cents(data.settings.piggyFull)); } });
    b.appendChild(h('div', { class: 'sec' }, [h('h3', null, 'Sparschwein'),
      h('div', { class: 'row' }, [h('span', null, 'Sparschwein ist voll bei'), fullInp, h('span', null, '€')]),
      h('div', { class: 'muted', style: { 'font-size': '14px' } }, 'Nur für die Füllhöhe der Grafik. Der Saldo kann beliebig wachsen.')]));

    /* PIN */
    b.appendChild(h('div', { class: 'sec' }, [h('h3', null, 'PIN'),
      h('button', { class: 'btn', onclick: function () { setPinFlow(function () { toast('PIN geändert'); }); } }, 'PIN ändern')]));

    /* Backup */
    var fileInp = h('input', { type: 'file', accept: '.json,application/json,text/plain', style: { display: 'none' },
      onchange: function () {
        var f = fileInp.files && fileInp.files[0];
        if (!f) return;
        var rd = new FileReader();
        rd.onload = function () { importJson(String(rd.result), close); };
        rd.onerror = function () { toast('Datei konnte nicht gelesen werden.'); };
        rd.readAsText(f);
      } });
    var pasteArea = h('textarea', { class: 'inp', placeholder: 'Backup-Text hier einfügen …' });
    var bs = h('div', { class: 'sec' }, [h('h3', null, 'Backup'),
      h('div', { class: 'row' }, [
        h('button', { class: 'btn primary', onclick: exportFile }, 'Als Datei exportieren'),
        h('button', { class: 'btn', onclick: function () { exportText = exportText ? null : JSON.stringify(data, null, 1); build(); } }, exportText ? 'Text ausblenden' : 'Als Text anzeigen'),
        h('button', { class: 'btn', onclick: function () { fileInp.click(); } }, 'Datei importieren'),
        fileInp
      ])
    ]);
    if (exportText) {
      var ta = h('textarea', { class: 'inp', readonly: true, value: exportText });
      bs.appendChild(ta);
      bs.appendChild(h('button', { class: 'btn', onclick: function () {
        ta.focus(); ta.select();
        try { document.execCommand('copy'); toast('In die Zwischenablage kopiert'); } catch (e) { toast('Bitte manuell kopieren'); }
      } }, 'Alles markieren & kopieren'));
    }
    bs.appendChild(h('label', { class: 'lbl' }, 'Import per Text (falls Dateiauswahl im Kiosk-Browser nicht verfügbar ist)'));
    bs.appendChild(pasteArea);
    bs.appendChild(h('button', { class: 'btn', onclick: function () { importJson(pasteArea.value, close); } }, 'Text importieren'));
    b.appendChild(bs);

    /* Info */
    b.appendChild(h('div', { class: 'sec' }, [h('h3', null, 'Speicher'),
      h('div', null, 'localStorage: ' + (ui.lsOk ? '✔ funktioniert' : '✖ nicht verfügbar')),
      h('div', null, 'IndexedDB (Zweitablage): ' + (ui.idbOk ? '✔ funktioniert' : '✖ nicht verfügbar')),
      h('div', { class: 'muted', style: { 'font-size': '14px' } }, 'Zuletzt gespeichert: ' + (data.savedAt ? new Date(data.savedAt).toLocaleString('de-DE') : '–'))]));

    appendKids(parts.foot, [h('button', { class: 'btn danger', onclick: function () { lockNow(); } }, '🔒 Sperren'), h('span', { class: 'spacer' }), h('button', { class: 'btn primary', onclick: close }, 'Fertig')]);
    parts.body.scrollTop = sc;
  }

  function move(arr, i, dir) { var x = arr[i]; arr[i] = arr[i + dir]; arr[i + dir] = x; }
  function swapOrder(st, i, j) { var o = st[i].order; st[i].order = st[j].order; st[j].order = o; renumberTasks(); }
  function deleteProfile(p) {
    confirmDlg('Profil löschen?', 'Profil „' + p.name + '“ wird mit seinen Zuordnungen, erledigten Einträgen und Auszahlungen gelöscht. Das lässt sich nicht rückgängig machen.', 'Löschen', true, function () {
      data.profiles.splice(data.profiles.indexOf(p), 1);
      data.assignments = data.assignments.filter(function (a) { return a.profileId !== p.id; });
      data.completions = data.completions.filter(function (c) { return c.profileId !== p.id; });
      if (data.settings.selected === p.id) data.settings.selected = null;
      delete piggies[p.id];
      save(); build();
    });
  }
  build();
}

function exportFile() {
  var json = JSON.stringify(data, null, 1);
  var name = 'haushaltsplaner-backup-' + ui.today + '.json';
  try {
    var blob = new Blob([json], { type: 'application/json' });
    if (window.navigator && window.navigator.msSaveBlob) { window.navigator.msSaveBlob(blob, name); return; }
    var url = URL.createObjectURL(blob);
    var a = h('a', { href: url, download: name, style: { display: 'none' } });
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); document.body.removeChild(a); }, 1000);
    toast('Export gestartet. Falls nichts passiert: „Als Text anzeigen“ nutzen.');
  } catch (e) {
    toast('Download nicht möglich. Bitte „Als Text anzeigen“ nutzen.');
  }
}
function importJson(text, after) {
  var obj;
  try { obj = JSON.parse(text); } catch (e) { toast('Ungültige Datei: kein JSON.'); return; }
  var n = normalize(obj);
  if (!n) { toast('Ungültiges Backup: Profile oder Aufgaben fehlen.'); return; }
  confirmDlg('Backup importieren?', 'Die aktuellen Daten werden durch das Backup ersetzt (' + n.profiles.length + ' Profile, ' + n.tasks.length + ' Aufgaben, ' + n.completions.length + ' Erledigungen).', 'Importieren', true, function () {
    if (!n.settings.pinHash) { n.settings.pinHash = data.settings.pinHash; n.settings.pinSalt = data.settings.pinSalt; }
    data = n;
    piggies = {};
    save();
    if (after) after();
    renderAll();
    toast('Backup importiert');
  });
}

/* =====================================================================
   Ersteinrichtung & Beispieldaten
   ===================================================================== */
function createSampleTasks() {
  var all = data.profiles.map(function (p) { return p.id; });
  var samples = [
    { title: 'Zimmer aufräumen', icon: '🧹', value: 0.5, sch: { type: 'weekdays', days: [1, 3, 5] } },
    { title: 'Tisch decken', icon: '🍽️', value: 0.2, sch: { type: 'weekdays', days: [1, 2, 3, 4, 5, 6, 7] } },
    { title: 'Müll rausbringen', icon: '🗑️', value: 0.3, sch: { type: 'interval', everyDays: 2, start: ui.today } },
    { title: 'Hausaufgaben', icon: '📚', value: 0.2, sch: { type: 'weekdays', days: [1, 2, 3, 4, 5] } },
    { title: 'Pflanzen gießen', icon: '', value: 0.3, sch: { type: 'interval', everyDays: 7, start: weekStart(ui.today) } }
  ];
  samples.forEach(function (s) {
    var t = { id: uid('t'), title: s.title, icon: s.icon, value: s.value, order: nextOrder() };
    data.tasks.push(t);
    all.forEach(function (pid) {
      data.assignments.push({ id: uid('a'), taskId: t.id, profileId: pid, valueOverride: null,
        schedule: JSON.parse(JSON.stringify(s.sch)) });
    });
  });
  save();
  renderBoard();
  toast('Beispielaufgaben angelegt');
}

function firstRun() {
  var m = openModal('');
  var parts = dialogParts(m, 'Willkommen beim Haushaltsplaner 🐷');
  appendKids(parts.body, [
    h('p', null, 'Aufgaben abhaken, Sparschwein füllen, Taschengeld auszahlen.'),
    h('p', null, 'Zuerst wird ein Eltern-PIN festgelegt. Er schützt das Bearbeiten von Aufgaben, vergangene Tage, Auszahlungen und die Einstellungen.')
  ]);
  parts.foot.appendChild(h('button', { class: 'btn primary', onclick: function () { m.close(); setPinFlow(setupProfiles, true); } }, 'PIN festlegen'));
}
function setupProfiles() {
  if (data.profiles.length) { renderAll(); return; }
  var m = openModal('');
  var parts = dialogParts(m, 'Wer macht mit?');
  var inputs = [0, 1, 2, 3].map(function (i) { return h('input', { class: 'inp', placeholder: i === 0 ? 'Name, z. B. Anna' : 'weiterer Name (optional)', maxlength: '24' }); });
  var sample = true;
  var sw = h('button', { class: 'switch on', onclick: function () { sample = !sample; sw.className = 'switch' + (sample ? ' on' : ''); } }, [h('i'), 'Beispielaufgaben anlegen']);
  var err = h('div', { class: 'pinmsg', style: { 'text-align': 'left' } });
  appendKids(parts.body, [h('div', { class: 'muted' }, 'Ein Profil je Person. Später unter ⚙️ änderbar.'),
    inputs.map(function (x) { return h('div', { style: { margin: '6px 0' } }, x); }), sw, err]);
  parts.foot.appendChild(h('button', { class: 'btn primary', onclick: function () {
    var names = inputs.map(function (x) { return x.value.trim(); }).filter(Boolean);
    if (!names.length) { err.textContent = 'Bitte mindestens einen Namen eingeben.'; return; }
    names.forEach(function (n, i) {
      data.profiles.push({ id: uid('p'), name: n, color: COLORS[i % COLORS.length], avatar: '', pinned: names.length > 1, payouts: [] });
    });
    m.close();
    if (sample) createSampleTasks(); else save();
    renderAll();
  } }, 'Los geht’s'));
  setTimeout(function () { inputs[0].focus(); }, 50);
}

/* =====================================================================
   Start & Takt
   ===================================================================== */
function renderAll() { renderTabs(); renderWeekNav(); renderBoard(); renderLock(); renderBanner(); }

$('prevw').addEventListener('click', function () { ui.weekOffset--; renderWeekNav(); renderBoard(); });
$('nextw').addEventListener('click', function () { ui.weekOffset++; renderWeekNav(); renderBoard(); });
$('todayw').addEventListener('click', function () { ui.weekOffset = 0; renderWeekNav(); renderBoard(); });
$('gear').addEventListener('click', function () { requirePin(openSettings, 'Einstellungen'); });

var resizeTimer = null;
window.addEventListener('resize', function () { clearTimeout(resizeTimer); resizeTimer = setTimeout(renderBoard, 150); });

var wasUnlocked = false;
setInterval(function () {
  var now = isUnlocked();
  if (now) renderLock();
  if (wasUnlocked && !now) onLockExpired();
  wasUnlocked = now;
  var t = todayStr();
  if (t !== ui.today) { ui.today = t; renderAll(); }   /* Tageswechsel um Mitternacht */
}, 1000);

function start(loaded) {
  data = loaded || emptyData();
  renderAll();
  if (!data.settings.pinHash) firstRun();
  else if (!data.profiles.length) renderBoard();
}

(function boot() {
  var ls = normalize(loadLS());
  idbOpen(function () {
    idbGet(function (json) {
      var fromIdb = null;
      try { fromIdb = json ? normalize(JSON.parse(json)) : null; } catch (e) { fromIdb = null; }
      var chosen = ls;
      if (fromIdb && (!ls || fromIdb.savedAt > ls.savedAt)) chosen = fromIdb;
      start(chosen);
      if (chosen && chosen === fromIdb && fromIdb !== ls) save();   /* localStorage nachziehen */
    });
  });
})();

/* Für automatisierte Tests */
window.__hp = { sha256: sha256, isDue: isDue, isoDay: isoDay, isoWeek: isoWeek, diffDays: diffDays, parseMoney: parseMoney,
  schedText: schedText, normalize: normalize, getData: function () { return data; }, balance: balance };
})();
</script>
